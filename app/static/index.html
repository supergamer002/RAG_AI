<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAG AI</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--surface:#fff;--surface2:#f8fafc;--text:#182033;--muted:#687386;--border:#e3e8f0;--accent:#3867f5;--accent-soft:#edf2ff;--ok:#24965f;--ok-soft:#e9f8f0;--warn:#b77912;--warn-soft:#fff6df;--danger:#cf3f4d;--danger-soft:#fff0f1;--shadow:0 8px 28px rgba(24,32,51,.06)}
:root.dark{color-scheme:dark;--bg:#0f1420;--surface:#171d2a;--surface2:#111824;--text:#e8ecf6;--muted:#98a2b6;--border:#293244;--accent:#6c8dff;--accent-soft:#1c294c;--ok:#4ac486;--ok-soft:#153427;--warn:#e5ae45;--warn-soft:#352b18;--danger:#ff6b76;--danger-soft:#3a1e23;--shadow:0 8px 28px rgba(0,0,0,.22)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:7px 11px;transition:.15s}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}.icon{width:34px;height:34px;padding:0;display:grid;place-items:center}.muted{color:var(--muted)}
#app{display:flex;width:100%;min-width:0}aside{width:310px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:100%;padding:14px}.brand{display:flex;align-items:center;gap:10px;padding:4px 5px 18px}.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}.brand strong{font-size:16px}.brand small{display:block;color:var(--muted);font-size:11px}.section{margin-bottom:13px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 3px 7px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}.new-chat{width:100%;padding:9px 12px}.drop{border:1.5px dashed var(--border);background:var(--surface2);border-radius:11px;padding:12px;text-align:center;color:var(--muted);font-size:12px;transition:.15s}.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}.list{max-height:210px;overflow:auto}.item{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:8px;min-width:0}.item:hover{background:var(--surface2)}.item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item small{color:var(--muted);font-size:11px}.item .x{border:0;background:transparent;padding:2px 4px;color:var(--muted)}.item .x:hover{color:var(--danger)}.job{border:1px solid var(--border);border-radius:10px;padding:9px;margin-bottom:7px;background:var(--surface2)}.job-head{display:flex;gap:8px;align-items:center}.job-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font-size:10px;padding:2px 6px;border-radius:999px;font-weight:700;background:var(--accent-soft);color:var(--accent)}.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.err{background:var(--danger-soft);color:var(--danger)}.progress{height:5px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:7px}.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}.job small{display:block;margin-top:5px;color:var(--muted);font-size:11px}.side-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:10px;display:flex;align-items:center;gap:8px}.status{flex:1;color:var(--muted);font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:5px}.dot.on{background:var(--ok)}
main{flex:1;display:flex;flex-direction:column;min-width:0}.topbar{height:62px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top-title{font-weight:650}.top-actions{display:flex;gap:7px;align-items:center}.pill{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:11px} .tabs{display:flex;gap:4px;align-items:center;margin-left:18px}.tab{border:0;background:transparent;color:var(--muted);padding:7px 11px;border-radius:8px;font-size:12px}.tab:hover{background:var(--surface2);border-color:transparent}.tab.active{background:var(--accent-soft);color:var(--accent);font-weight:700}.view{height:100%;min-height:0}.hidden{display:none!important}.ingest-view{overflow:auto;padding:28px 20px}.ingest-wrap{width:min(980px,100%);margin:0 auto}.ingest-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}.ingest-title h2{margin:0;font-size:22px}.ingest-title p{margin:4px 0 0;color:var(--muted)}.ingest-card{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}.stage-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:13px}.stage{padding:7px 6px;border:1px solid var(--border);border-radius:8px;text-align:center;font-size:10px;color:var(--muted);background:var(--surface2)}.stage.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}.stage.done{color:var(--ok);border-color:var(--ok-soft);background:var(--ok-soft)}.stage.error{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}.chunk-progress{margin-top:10px}.chunk-progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}.chunk-progress .big-progress{margin-top:0;height:6px}.ingest-card-head{display:flex;align-items:center;gap:10px}.ingest-card-head .name{flex:1;min-width:0;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ingest-meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin-top:9px}.big-progress{height:9px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:12px}.big-progress i{display:block;height:100%;background:var(--accent);transition:width .35s}.ingest-files{margin-top:12px;border-top:1px solid var(--border);padding-top:9px}.ingest-file{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px}.ingest-file .file-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ingest-file small{color:var(--muted)}.empty-state{border:1px dashed var(--border);background:var(--surface2);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}.banner{display:none;padding:9px 18px;background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--border);font-size:12px}.banner.err{background:var(--danger-soft);color:var(--danger)}#msgs{flex:1;overflow:auto;padding:28px 20px}.wrap{width:min(900px,100%);margin:auto}.empty{margin:13vh auto 0;text-align:center;max-width:480px}.empty .hero{width:56px;height:56px;margin:0 auto 13px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:24px}.empty h2{margin:0 0 6px;font-size:22px}.empty p{margin:0;color:var(--muted)}.msg{margin-bottom:20px}.msg .b{max-width:850px;padding:11px 14px;border:1px solid var(--border);background:var(--surface);border-radius:13px;box-shadow:var(--shadow);overflow-wrap:anywhere}.msg.user .b{margin-left:auto;max-width:75%;background:var(--accent);border-color:var(--accent);color:#fff;white-space:pre-wrap;box-shadow:none}.msg .b p{margin:0 0 8px}.msg .b p:last-child{margin:0}.msg pre{background:var(--surface2);padding:10px;border-radius:8px;overflow:auto}.msg code{background:var(--surface2);padding:1px 4px;border-radius:4px}.cite{color:var(--accent);font-weight:700}.srcs{margin-top:7px;color:var(--muted);font-size:12px}.srcs summary{cursor:pointer}.src{margin-top:6px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface2)}.src b{color:var(--text)}.src div{white-space:pre-wrap;max-height:130px;overflow:auto;margin-top:4px}#composer{border-top:1px solid var(--border);background:var(--surface);padding:13px 20px}.composer{display:flex;gap:9px;align-items:flex-end}.composer textarea{flex:1;resize:none;min-height:42px;max-height:180px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:11px;padding:10px 12px;outline:0}.composer textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);width:min(480px,92vw);padding:20px;box-shadow:var(--shadow)}dialog::backdrop{background:rgba(10,14,24,.48)}dialog label{display:block;font-size:12px;color:var(--muted);margin:11px 0 4px}dialog input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text)}.row{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.toast{position:fixed;right:18px;top:18px;max-width:380px;padding:10px 13px;border:1px solid var(--border);background:var(--surface);border-radius:10px;box-shadow:var(--shadow);display:none;z-index:20}.ready-panel{max-height:170px;overflow:auto}.ready-row{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:7px}.ready-row:hover{background:var(--surface2)}.ready-row .check{color:var(--ok)}
@media(max-width:800px){aside{width:260px}.topbar{padding:0 12px}#msgs{padding:18px 12px}.msg.user .b{max-width:88%}}@media(max-width:650px){aside{display:none}.topbar{height:54px}}
</style></head>
<body><div id="app">
<aside>
  <div class="brand"><div class="brand-mark">R</div><div><strong>RAG AI</strong><small>Document intelligence</small></div></div>
  <div class="section"><button class="primary new-chat" id="newChat">+ Nuova chat</button></div>
  <div class="section"><div class="section-title">Chat</div><div class="list" id="convs"></div></div>
  <div class="section" id="docsSection"><div class="section-title">Documenti <span style="display:flex;gap:4px"><button class="icon" id="pickFile" title="Aggiungi file">+</button><button class="icon" id="pickFolder" title="Aggiungi cartella">▦</button></span></div>
    <div class="drop" id="drop">Trascina file o una cartella qui<br><span>PDF · DOCX · TXT · MD · CSV · JSON · HTML</span></div>
    <input type="file" id="file" multiple webkitdirectory directory hidden accept=".pdf,.docx,.txt,.md,.markdown,.csv,.json,.html,.htm,.log,.rst">
    <input type="file" id="filesOnly" multiple hidden accept=".pdf,.docx,.txt,.md,.markdown,.csv,.json,.html,.htm,.log,.rst">
  </div>
  <div class="section"><div class="section-title">Ingest</div><div id="jobs"></div></div>
  <div class="section"><div class="section-title">Pronti</div><div class="ready-panel" id="ready"></div></div>
  <div class="side-bottom"><div class="status" id="stat"><span class="dot"></span>Connessione…</div><button class="icon" id="theme" title="Tema chiaro/scuro">◐</button><button id="openSettings">Impostazioni</button></div>
</aside>
<main><div class="topbar"><div style="display:flex;align-items:center;min-width:0"><div class="top-title">Assistente documentale</div><div class="tabs"><button class="tab active" id="tabChat">Chat</button><button class="tab" id="tabIngest">Ingestion</button></div></div><div class="top-actions"><span class="pill" id="modelPill">Ollama · —</span><span class="pill" id="docPill">0 documenti</span></div></div><div class="banner" id="banner"></div>
<div id="chatView" class="view"><div id="msgs"><div class="wrap" id="thread"></div></div>
<div id="composer"><div class="wrap composer"><textarea id="input" rows="1" placeholder="Fai una domanda sui tuoi documenti…"></textarea><button class="primary" id="send">Invia</button></div></div></div>
<div id="ingestView" class="view ingest-view hidden"><div class="ingest-wrap"><div class="ingest-title"><div><h2>Ingestion</h2><p>Monitora i file in coda, quelli in elaborazione e gli ingest completati.</p></div><button id="refreshIngest">Aggiorna</button></div><div id="ingestList"></div></div></div></main></div>
<dialog id="dlg"><h3 style="margin-top:0">Impostazioni</h3><label>Modello chat (Ollama)</label><input id="s_chat_model"><label>Modello embedding (Ollama)</label><input id="s_embed_model"><label>URL Ollama</label><input id="s_ollama_url"><label>Passaggi usati per rispondere (top-k)</label><input id="s_top_k" type="number" min="1" max="20"><label>Dimensione chunk</label><input id="s_chunk_size" type="number" min="200" max="4000"><label>Overlap chunk</label><input id="s_chunk_overlap" type="number" min="0" max="1000"><div class="row"><button id="reindex">Reindicizza</button><span style="display:flex;gap:7px"><button id="resetS">Default</button><button id="closeS">Chiudi</button><button class="primary" id="saveS">Salva</button></span></div></dialog>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let convId=null,busy=false;const terminal=new Set(['ready','partial','failed']);
async function api(path,opts={}){let r;try{r=await fetch(path,opts)}catch{throw Error('Server non raggiungibile. Riavvia l\'app.')}if(!r.ok){let d='';try{d=(await r.json()).detail}catch{}throw Error(d||`Errore HTTP ${r.status}`)}return r.json()}
const json=(m,b)=>({method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
function toast(msg,err=false){const t=$('toast');t.textContent=msg;t.style.display='block';t.style.borderColor=err?'var(--danger)':'var(--border)';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',5000)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmtSize=n=>n>1e9?(n/1e9).toFixed(1)+' GB':n>1e6?(n/1e6).toFixed(1)+' MB':Math.max(1,Math.round(n/1e3))+' KB';
function md(text){const blocks=[];let t=esc(text).replace(/```\w*\n?([\s\S]*?)```/g,(_,c)=>{blocks.push(`<pre><code>${c}</code></pre>`);return `\u0000${blocks.length-1}\u0000`});t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/\[(\d+)\]/g,'<span class="cite">[$1]</span>');t=t.split(/\n{2,}/).map(p=>/^\s*[-*] .+(\n|$)/.test(p)?'<ul>'+p.trim().split('\n').map(l=>`<li>${l.replace(/^\s*[-*] /,'')}</li>`).join('')+'</ul>':`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');return t.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i])}
function srcHtml(src){if(!src?.length)return '';return `<details class="srcs"><summary>${src.length} font${src.length===1?'e':'i'}</summary>`+src.map((s,i)=>`<div class="src"><b>[${i+1}] ${esc(s.document)}${s.page?', p. '+s.page:''}</b><div>${esc(s.text)}</div></div>`).join('')+'</details>'}
function addMsg(role,content,sources){const e=document.createElement('div');e.className='msg '+role;e.innerHTML='<div class="b"></div>'+(role==='assistant'?'<div class="sl"></div>':'');const b=e.querySelector('.b');if(role==='user')b.textContent=content;else b.innerHTML=md(content||'');if(sources)e.querySelector('.sl').innerHTML=srcHtml(sources);$('thread').appendChild(e);$('msgs').scrollTop=$('msgs').scrollHeight;return e}
function showEmpty(){$('thread').innerHTML='<div class="empty"><div class="hero">⌘</div><h2>Chiedi ai tuoi documenti</h2><p>Carica file o intere cartelle, attendi che siano <b>Pronti</b>, poi poni la tua domanda.</p></div>'}
async function loadDocs(){const docs=await api('/api/documents');$('docs')?.remove();const section=$('docsSection');if(!section)return;const list=document.createElement('div');list.id='docs';list.className='list';section.appendChild(list);if(!docs.length){list.innerHTML='<div class="item"><small>Nessun documento</small></div>';return}docs.forEach(d=>{const e=document.createElement('div');e.className='item';e.innerHTML=`<span class="name" title="${esc(d.name)}">${esc(d.name)}</span><small>${fmtSize(d.size)}</small><button class="x" title="Elimina">✕</button>`;e.querySelector('.x').onclick=async()=>{if(!confirm(`Eliminare "${d.name}"?`))return;try{await api('/api/documents/'+d.id,{method:'DELETE'});loadDocs();refreshStatus()}catch(x){toast(x.message,true)}};list.appendChild(e)})}
async function loadConvs(){const cs=await api('/api/conversations');$('convs').innerHTML=cs.length?'':'<div class="item"><small>Nessuna chat</small></div>';cs.forEach(c=>{const e=document.createElement('div');e.className='item'+(c.id===convId?' active':'');e.innerHTML=`<span class="name" title="${esc(c.title)}">${esc(c.title)}</span><button class="x">✕</button>`;e.onclick=()=>openConv(c.id);e.querySelector('.x').onclick=async ev=>{ev.stopPropagation();try{await api('/api/conversations/'+c.id,{method:'DELETE'});if(c.id===convId)newChat();loadConvs()}catch(x){toast(x.message,true)}};$('convs').appendChild(e)})}
async function openConv(id){try{const c=await api('/api/conversations/'+id);convId=id;$('thread').innerHTML='';c.messages.forEach(m=>addMsg(m.role,m.content,m.sources));loadConvs()}catch(e){toast(e.message,true)}}function newChat(){convId=null;showEmpty();loadConvs();$('input').focus()}
async function send(){const text=$('input').value.trim();if(!text||busy)return;busy=true;$('send').disabled=true;$('input').value='';autosize();if(!convId)$('thread').innerHTML='';addMsg('user',text);const el=addMsg('assistant','…'),b=el.querySelector('.b');let answer='';try{const r=await fetch('/api/chat',json('POST',{message:text,conversation_id:convId,stream:true}));if(!r.ok){let d='';try{d=(await r.json()).detail}catch{}throw Error(d||'Errore chat')}const reader=r.body.getReader(),dec=new TextDecoder();let buf='';while(true){const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+2);if(!line.startsWith('data:'))continue;const ev=JSON.parse(line.slice(5));if(ev.type==='meta')convId=ev.conversation_id;else if(ev.type==='sources')el.querySelector('.sl').innerHTML=srcHtml(ev.sources);else if(ev.type==='token'){answer+=ev.content;b.innerHTML=md(answer);$('msgs').scrollTop=$('msgs').scrollHeight}else if(ev.type==='error')throw Error(ev.message)}}if(!answer)b.textContent='(nessuna risposta)'}catch(e){b.innerHTML=`<span style="color:var(--danger)">${esc(e.message)}</span>`}finally{busy=false;$('send').disabled=false;loadConvs();$('input').focus()}}
function jobBadge(status){return status==='ready'?'<span class="badge ok">PRONTO</span>':status==='failed'?'<span class="badge err">ERRORE</span>':status==='partial'?'<span class="badge err">PARZIALE</span>':`<span class="badge">${status==='processing'?'IN CORSO':'IN CODA'}</span>`}
function jobLabel(status){return status==='ready'?'PRONTO':status==='failed'?'ERRORE':status==='partial'?'PARZIALE':status==='processing'?'IN CORSO':'IN CODA'}
function jobBadge(status){const cls=status==='ready'?'ok':(status==='failed'||status==='partial'?'err':'');return `<span class="badge ${cls}">${jobLabel(status)}</span>`}
function renderJobs(jobs){$('jobs').innerHTML='';if(!jobs.length){$('jobs').innerHTML='<div class="muted" style="font-size:12px;padding:5px">Nessun ingest recente.</div>';return}jobs.slice(0,5).forEach(j=>{const e=document.createElement('div');e.className='job';const pct=Math.round(j.progress*100);e.innerHTML=`<div class="job-head"><span class="job-title">${esc(j.current_file||`${j.total_files} file`)}</span>${jobBadge(j.status)}</div><div class="progress"><i style="width:${pct}%"></i></div><small>${j.completed_files}/${j.total_files} pronti${j.failed_files?' · '+j.failed_files+' errori':''}</small>`;$('jobs').appendChild(e)})}
function renderReady(jobs){const done=jobs.filter(j=>terminal.has(j.status)&&j.completed_files>0);$('ready').innerHTML=done.length?done.slice(0,5).map(j=>`<div class="ready-row"><span class="check">✓</span><span class="name">${j.completed_files} file pronti</span><small>${j.finished_at?new Date(j.finished_at*1000).toLocaleTimeString():''}</small></div>`).join(''):'<div class="muted" style="font-size:12px;padding:5px">Nessun file pronto tramite job recenti.</div>'}
function renderIngest(jobs){
 const root=$('ingestList');
 if(!jobs.length){root.innerHTML='<div class="empty-state">Nessun job di ingestion.</div>';return}
 const labels={extraction:'Estrazione',segmentation:'Segmentazione',embedding:'Embedding',saving:'Salvataggio'};
 const stages=['extraction','segmentation','embedding','saving'];
 root.innerHTML=jobs.map(j=>{
   const pct=Math.round(j.progress*100), sp=Math.round((j.stage_progress||0)*100);
   const current=stages.indexOf(j.stage);
   const stageHtml=stages.map((st,i)=>{
     let cls=i<current?'done':i===current?'active':'';
     if(j.status==='failed'&&i===current)cls='error';
     return `<div class="stage ${cls}">${labels[st]}</div>`;
   }).join('');
   const chunkTotal=j.total_chunks||0, chunkDone=j.processed_chunks||0;
   return `<div class="ingest-card">
     <div class="ingest-card-head"><span class="name">${esc(j.current_file||`${j.total_files} file`)}</span>${jobBadge(j.status)}<strong>${pct}%</strong></div>
     <div class="big-progress"><i style="width:${pct}%"></i></div>
     <div class="stage-flow">${stageHtml}</div>
     <div class="ingest-meta"><span>${esc(labels[j.stage]||j.stage||'In coda')} · ${sp}%</span><span>${esc(j.message||'')}</span></div>
     ${chunkTotal?`<div class="chunk-progress"><div class="chunk-progress-head"><span>Chunk / embedding</span><span>${chunkDone}/${chunkTotal}</span></div><div class="big-progress"><i style="width:${Math.min(100,Math.round(chunkDone/chunkTotal*100))}%"></i></div></div>`:''}
     <div class="ingest-meta"><span>${j.completed_files}/${j.total_files} file completati${j.failed_files?' · '+j.failed_files+' errori':''}</span><span>${j.total_bytes?fmtSize(j.processed_bytes)+' / '+fmtSize(j.total_bytes):''}</span></div>
     ${(j.files||[]).length?`<div class="ingest-files">${j.files.map(f=>`<div class="ingest-file"><span>${f.status==='ready'?'✓':f.status==='failed'?'✕':f.status==='processing'?'◉':'○'}</span><span class="file-name" title="${esc(f.name)}">${esc(f.name)}</span><small>${esc(f.status)}</small></div>`).join('')}</div>`:''}
   </div>`;
 }).join('');
}
async function refreshJobs(){try{const r=await api('/api/ingest/jobs');renderJobs(r.jobs);renderReady(r.jobs);renderIngest(r.jobs)}catch{}}
async function refreshStatus(){try{const s=await api('/api/status');$('stat').innerHTML=`<span class="dot ${s.ready?'on':''}"></span>${s.ready?'Online':'Preparazione…'}`;$('modelPill').textContent='Ollama · '+(s.chat_model?.available?'Online':'Model Error');$('docPill').textContent=`${s.documents} document${s.documents===1?'o':'i'}`;const b=$('banner');if(s.active_ingest_jobs)b.textContent=`Ingest in corso: ${s.active_ingest_jobs} job attiv${s.active_ingest_jobs===1?'o':'i'}. Puoi continuare a usare l\'app.`;else if(!s.ollama){b.textContent='Ollama non è raggiungibile.';b.className='banner err'}else if(s.pulling){b.textContent=`Preparazione modello ${s.pulling} · ${Math.round(s.progress*100)}%`}else{b.textContent=''}b.style.display=b.textContent?'block':'none'}catch{$('stat').innerHTML='<span class="dot"></span>Offline'}}
async function upload(files){files=[...files].filter(f=>f.size>0);if(!files.length)return;try{const fd=new FormData();files.forEach(f=>fd.append('files',f,f.webkitRelativePath||f.name));const r=await api('/api/documents',{method:'POST',body:fd});toast(`${files.length} file messi in coda. Job ${r.job_id.slice(0,8)}…`);refreshJobs();pollJobs()}catch(e){toast(e.message,true)}}
let polling=false;async function pollJobs(){if(polling)return;polling=true;for(let i=0;i<180;i++){await refreshJobs();const r=await api('/api/ingest/jobs').catch(()=>null);if(!r||!r.jobs.some(j=>j.status==='queued'||j.status==='processing'))break;await new Promise(x=>setTimeout(x,2000))}polling=false;loadDocs();refreshStatus()}
async function openSettings(){const s=await api('/api/settings');for(const k in s)if($('s_'+k))$('s_'+k).value=s[k];$('dlg').showModal()}async function saveSettings(){const nums=['top_k','chunk_size','chunk_overlap'],body={};['chat_model','embed_model','ollama_url',...nums].forEach(k=>{const v=$('s_'+k).value;body[k]=nums.includes(k)?Number(v):v});try{await api('/api/settings',json('PUT',body));$('dlg').close();toast('Impostazioni salvate');refreshStatus()}catch(e){toast(e.message,true)}}function autosize(){const t=$('input');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,180)+'px'}
function showView(name){const chat=name==='chat';$('chatView').classList.toggle('hidden',!chat);$('ingestView').classList.toggle('hidden',chat);$('tabChat').classList.toggle('active',chat);$('tabIngest').classList.toggle('active',!chat);if(!chat)refreshJobs()}
$('tabChat').onclick=()=>showView('chat');$('tabIngest').onclick=()=>showView('ingest');$('refreshIngest').onclick=refreshJobs;
$('send').onclick=send;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('input').addEventListener('input',autosize);$('newChat').onclick=newChat;$('pickFile').onclick=()=>$('filesOnly').click();$('pickFolder').onclick=()=>$('file').click();$('file').onchange=e=>{upload(e.target.files);e.target.value=''};$('filesOnly').onchange=e=>{upload(e.target.files);e.target.value=''};$('openSettings').onclick=()=>openSettings().catch(e=>toast(e.message,true));$('closeS').onclick=()=>$('dlg').close();$('saveS').onclick=saveSettings;$('resetS').onclick=async()=>{try{await api('/api/settings/reset',{method:'POST'});await openSettings()}catch(e){toast(e.message,true)}};$('reindex').onclick=async()=>{toast('Reindicizzazione in corso…');try{const r=await api('/api/reindex',{method:'POST'});toast(`Reindicizzati ${r.reindexed_chunks} passaggi`);refreshStatus()}catch(e){toast(e.message,true)}};
$('theme').onclick=()=>{document.documentElement.classList.toggle('dark');localStorage.setItem('rag-theme',document.documentElement.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('rag-theme')==='dark')document.documentElement.classList.add('dark');
const drop=$('drop');['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over') }));drop.addEventListener('drop',e=>upload(e.dataTransfer.files));
showEmpty();loadDocs().catch(()=>{});loadConvs().catch(()=>{});refreshStatus();refreshJobs();setInterval(()=>{refreshStatus();refreshJobs()},3000);
</script></body></html>
